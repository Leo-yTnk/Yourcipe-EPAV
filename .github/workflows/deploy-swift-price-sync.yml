name: Deploy Swift price sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/swift-price-sync/**'
      - 'supabase/functions/_shared/swift-price-core.js'
      - 'supabase/config.toml'
      - 'supabase/02*_swift*.sql'
      - '.github/workflows/deploy-swift-price-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-price-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing Supabase access token::Add SUPABASE_ACCESS_TOKEN to the production environment secrets before deploying. See supabase/SWIFT_PRICE_SYNC.md#github-actions-credential."
            exit 1
          fi
          if [[ "$SUPABASE_ACCESS_TOKEN" == sb_publishable_* ]]; then
            echo "::error title=Invalid Supabase deploy credential::SUPABASE_ACCESS_TOKEN is a browser publishable key, not a personal access token. Create a personal access token in the Supabase dashboard and save that token as the production environment secret. See supabase/SWIFT_PRICE_SYNC.md#github-actions-credential."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Link project and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo '::warning title=Database migration skipped::SUPABASE_DB_PASSWORD is not configured. Deploying the Edge Function so its browser route and CORS preflight remain available; apply pending migrations before using synchronization.'
            exit 0
          fi
          supabase link --project-ref ytvztfvypiwgnslisxep --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy to the frontend's Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy swift-price-sync --project-ref ytvztfvypiwgnslisxep --no-verify-jwt
      - name: Verify gateway and browser preflight
        run: |
          test "$(curl --fail-with-body --silent --output /tmp/preflight --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://yourcipe.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,apikey,content-type' \
            https://ytvztfvypiwgnslisxep.supabase.co/functions/v1/swift-price-sync)" = 200
          grep -q '^ok$' /tmp/preflight
      - name: Verify unauthenticated POST is rejected by the handler
        run: |
          test "$(curl --silent --output /tmp/unauthorized --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' --data '{}' \
            https://ytvztfvypiwgnslisxep.supabase.co/functions/v1/swift-price-sync)" = 401
          grep -q '"code":"unauthorized"' /tmp/unauthorized
      - name: Controlled authenticated smoke tests
        env:
          USER_JWT: ${{ secrets.SWIFT_SMOKE_USER_JWT }}
          ADMIN_JWT: ${{ secrets.SWIFT_SMOKE_ADMIN_JWT }}
          PRODUCT_ID: ${{ secrets.SWIFT_SMOKE_PRODUCT_ID }}
        run: |
          if [ -z "$USER_JWT" ] || [ -z "$ADMIN_JWT" ]; then
            echo "Authenticated smoke tests skipped: configure SWIFT_SMOKE_USER_JWT and SWIFT_SMOKE_ADMIN_JWT in the production environment to enable them."
            exit 0
          fi
          test "$(curl -sS -o /tmp/forbidden -w '%{http_code}' -X POST -H "Authorization: Bearer $USER_JWT" -H 'Content-Type: application/json' -d '{}' https://ytvztfvypiwgnslisxep.supabase.co/functions/v1/swift-price-sync)" = 403
          test -n "$PRODUCT_ID" || { echo '::error::Missing SWIFT_SMOKE_PRODUCT_ID'; exit 1; }
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ADMIN_JWT" -H 'Content-Type: application/json' \
            -d "{\"productId\":\"$PRODUCT_ID\",\"requestId\":\"deploy-${GITHUB_SHA}\"}" \
            https://ytvztfvypiwgnslisxep.supabase.co/functions/v1/swift-price-sync | tee /tmp/admin-smoke
          grep -q '"products_failed":0' /tmp/admin-smoke
