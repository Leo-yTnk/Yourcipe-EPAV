<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{margin:0;box-sizing:border-box}body{width:700px;height:340px;padding:16px;font-family:var(--font-sans)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.YourcipeDesignSystem_f5a8dc;
function Demo(){
  const [gf, setGf] = React.useState(true);
  const [unit, setUnit] = React.useState('metric');
  const [on, setOn] = React.useState(false);
  return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
  <div style={{display:'flex',gap:16}}>
    <Input label="Recipe title" placeholder="e.g. Weeknight Ramen" />
    <Select label="Servings" options={["1","2","4","6"]} value="4" onChange={()=>{}} />
  </div>
  <div style={{display:'flex',gap:24,alignItems:'center'}}>
    <Checkbox label="Gluten-free only" checked={gf} onChange={e=>setGf(e.target.checked)} />
    <Radio name="unit" label="Metric" checked={unit==='metric'} onChange={()=>setUnit('metric')} />
    <Radio name="unit" label="Imperial" checked={unit==='imperial'} onChange={()=>setUnit('imperial')} />
    <Switch label="Notify me" checked={on} onChange={e=>setOn(e.target.checked)} />
  </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
